<!-- Scripting for QR and Voice AI Interaction -->
    <script>
        // Generate QR Code
        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 130,
            height: 130,
            colorDark: "#020617",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // Voice-enabled Talk to me button action
        async function talkToMe() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser. Please try Chrome or Edge.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            alert("Listening... Speak your question now!");
            recognition.start();

            recognition.onresult = async function(event) {
                const userMessage = event.results[0][0].transcript;
                console.log("User said: ", userMessage);

                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userMessage })
                    });
                    
                    const data = await response.json();
                    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Hello! I am the KS TECH LLC digital assistant.";
                    
                    speakWithFemaleVoice(reply);
                } catch (err) {
                    console.error("Error:", err);
                    alert("Error connecting to assistant.");
                }
            };

            recognition.onerror = function(event) {
                console.error("Speech recognition error", event.error);
                alert("Could not hear you clearly. Please try again.");
            };
        }

        // Enforced Female Text-to-Speech Helper
        function speakWithFemaleVoice(text) {
            if (!('speechSynthesis' in window)) {
                alert(text);
                return;
            }

            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 1.0; 
            utterance.pitch = 1.2; // Slightly higher pitch to ensure a feminine vocal register

            const voices = window.speechSynthesis.getVoices();
            
            // Search explicitly for known female voice signatures across platforms
            const femaleVoice = voices.find(v => {
                const name = v.name.toLowerCase();
                return (
                    name.includes('female') || 
                    name.includes('zira') || 
                    name.includes('samantha') || 
                    name.includes('karen') ||
                    name.includes('victoria') ||
                    name.includes('aria') ||
                    name.includes('jenny') ||
                    name.includes('susan') ||
                    name.includes('hazel') ||
                    name.includes('catherine') ||
                    (v.lang.startsWith('en') && (name.includes('girl') || name.includes('woman')))
                );
            }) || voices.find(v => v.lang.startsWith('en')); // Fallback to any English voice if specific match isn't loaded yet

            if (femaleVoice) {
                utterance.voice = femaleVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        // Ensure voices are preloaded
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }
    </script>
