<!-- Scripting for QR and Voice AI Interaction -->
    <script>
        // Generate QR Code
        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 130,
            height: 130,
            colorDark: "#020617",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // Voice-enabled Talk to me button action
        async function talkToMe() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser. Please try Chrome or Safari.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            alert("Listening... Speak your question now!");
            recognition.start();

            recognition.onresult = async function(event) {
                const userMessage = event.results[0][0].transcript;
                console.log("User said: ", userMessage);

                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userMessage })
                    });
                    
                    const data = await response.json();
                    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Hello! I am the KS TECH LLC digital assistant.";
                    
                    // Speak the response back out loud
                    speakText(reply);
                } catch (err) {
                    console.error("Error:", err);
                    alert("Error connecting to assistant.");
                }
            };

            recognition.onerror = function(event) {
                console.error("Speech recognition error", event.error);
                alert("Could not hear you clearly. Please try again.");
            };
        }

        // Text-to-Speech Helper
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            } else {
                alert(text); // Fallback to alert if speech synthesis isn't supported
            }
        }
    </script>
